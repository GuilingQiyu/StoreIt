server:
  port: 59898
  servlet:
    session:
      timeout: 30d
  ssl:
  # openssl pkcs12 -export -in /home/ubuntu/http/cert.pem -inkey /home/ubuntu/http/key.pem -out /home/ubuntu/http/keystore.p12 -name spring -passout pass:changeit
    enabled: false
    key-store: ./keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
  error:
    whitelabel:
      enabled: false

spring:
  config:
    import:
      # application.yml 在前，admin.yml 在后；同名项以后者为准（管理员口令以 admin.yml 为准）
      - optional:file:./config/application.yml
      - optional:file:./config/admin.yml
  datasource:
    url: jdbc:sqlite:./data/storeit.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

app:
  storage-root: storage
  ssl-enabled: false
  session:
    max-age-days: 30
    cookie-name: STOREIT_SESSION

logging:
  level:
    root: info