<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 未找到页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #ecfeff 100%);
            color: #1e293b;
        }
        .error-card {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            margin: 16px;
            box-shadow: 0 20px 50px -20px rgba(15, 23, 42, 0.15);
        }
        .error-code {
            font-size: 64px;
            font-weight: 800;
            color: #6366f1;
            letter-spacing: 2px;
            line-height: 1;
        }
        h1 { font-size: 20px; margin: 14px 0 8px; }
        p { font-size: 14px; color: #64748b; margin-bottom: 26px; }
        .actions a {
            display: inline-block;
            margin: 0 6px;
            padding: 10px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.15s ease;
        }
        .actions a:hover { opacity: 0.85; }
        .btn-primary { background: #6366f1; color: #ffffff; }
        .btn-ghost { background: #f1f5f9; color: #334155; }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-code">404</div>
    <h1>页面未找到</h1>
    <p>抱歉，我们找不到您请求的页面。</p>
    <div class="actions">
        <a href="/" class="btn-primary">返回首页</a>
    </div>
</div>
</body>
</html>
