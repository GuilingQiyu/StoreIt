<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 文件服务器</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script defer src="/static/js/script.js"></script>
</head>
<body>
<div class="floating-bg"></div>
<div class="login-container">
    <h1>用户登录</h1>
    <form id="loginForm">
        <div class="input-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="input-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">登录</button>
    </form>
    <div id="messageArea" class="message" style="display: none;"></div>
    <footer>
        <p>
            <a href="/about" class="btn">关于</a>
        </p>
        <p>© 2025–2026 归灵祈昱</p>
        <p>源码以 <a href="https://www.gnu.org/licenses/agpl-3.0.html">AGPL-3.0-or-later</a> 授权，见 <a href="https://github.com/GuilingQiyu/StoreIt">GitHub</a></p>
    </footer>
</div>
</body>
</html>
