<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 文件服务器</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script defer src="/static/js/script.js"></script>
</head>
<body>
<div class="floating-bg"></div>
<div class="login-container">
    <h1>修改密码</h1>
    <p style="margin-bottom:1rem;color:#666;font-size:0.9rem;">检测到仍在使用文档示例默认口令，或管理员要求改密。请设置新密码后再使用网盘功能。</p>
    <form id="changePasswordForm">
        <div class="input-group">
            <label for="currentPassword">当前密码</label>
            <input type="password" id="currentPassword" name="currentPassword" required>
        </div>
        <div class="input-group">
            <label for="newPassword">新密码（至少 8 位）</label>
            <input type="password" id="newPassword" name="newPassword" minlength="8" required>
        </div>
        <div class="input-group">
            <label for="confirmPassword">确认新密码</label>
            <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required>
        </div>
        <button type="submit" class="btn">保存新密码</button>
    </form>
    <div id="messageArea" class="message" style="display: none;"></div>
    <footer>
        <p><a href="/login" class="btn">返回登录</a></p>
        <p>© 2025 归灵祈昱</p>
    </footer>
</div>
</body>
</html>
