name: Release

# 推送形如 v1.4.0 的标签时触发；也支持在 Actions 页面手动运行
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release / 上传产物需要写权限

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            POM_VER=$(python3 -c 'import re; from pathlib import Path; t=Path("pom.xml").read_text(); t=re.sub(r"<parent>.*?</parent>","",t,count=1,flags=re.S); m=re.search(r"<version>([^<]+)</version>",t); print(m.group(1) if m else "")')
            if [[ -z "$POM_VER" ]]; then
              echo "无法从 pom.xml 解析 version" >&2
              exit 1
            fi
            TAG="v${POM_VER}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Build changelog from Version.md
        id: notes
        run: |
          python3 .github/scripts/extract-changelog.py \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --out release-notes.md
          # softprops 更新已有 Release 时，仅 body_path 可能不覆盖正文；
          # 必须把内容放进 body 输出，显式传入 action 的 body 输入。
          {
            echo "body<<STOREIT_RELEASE_EOF"
            cat release-notes.md
            echo "STOREIT_RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
          echo "----- release notes preview -----"
          cat release-notes.md

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw -B -ntp -DskipTests clean package

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/storeit-*.jar dist/
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: StoreIt ${{ steps.ver.outputs.version }}
          # 显式 body，确保覆盖已有 Release 的自动生成说明
          body: ${{ steps.notes.outputs.body }}
          body_path: ${{ steps.notes.outputs.path }}
          append_body: false
          draft: false
          prerelease: false
          files: dist/*.jar
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
