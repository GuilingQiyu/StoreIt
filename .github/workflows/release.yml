name: Release

# 推送形如 v1.4.0 的标签时触发；也支持在 Actions 页面手动运行
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # 创建/删除 Release、上传产物需要写权限

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            POM_VER=$(python3 -c 'import re; from pathlib import Path; t=Path("pom.xml").read_text(); t=re.sub(r"<parent>.*?</parent>","",t,count=1,flags=re.S); m=re.search(r"<version>([^<]+)</version>",t); print(m.group(1) if m else "")')
            if [[ -z "$POM_VER" ]]; then
              echo "无法从 pom.xml 解析 version" >&2
              exit 1
            fi
            TAG="v${POM_VER}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Build changelog from Version.md
        run: |
          python3 .github/scripts/extract-changelog.py \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --out "${{ github.workspace }}/release-notes.md"
          test -s "${{ github.workspace }}/release-notes.md"
          echo "----- release notes preview -----"
          cat "${{ github.workspace }}/release-notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw -B -ntp -DskipTests clean package

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/storeit-*.jar dist/
          ls -la dist/

      # softprops 更新已有 Release 时，若 body 为空会保留旧正文（例如自动 Full Changelog）。
      # 同 tag 重发前先删掉旧 Release（保留 git tag），再创建，确保 Version.md 写入正文。
      - name: Remove existing GitHub Release (keep tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG (tag kept)..."
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag=false
          else
            echo "No existing release for $TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: StoreIt ${{ steps.ver.outputs.version }}
          body_path: ${{ github.workspace }}/release-notes.md
          draft: false
          prerelease: false
          files: dist/*.jar
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
