name: Release

# 推送形如 v1.3.2 的标签时构建，并把 Version.md 中对应版本写入 Release 页。
# 也可在 Actions 页面手动运行（版本取自 pom.xml）。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            POM_VER=$(python3 -c 'import re; from pathlib import Path; t=Path("pom.xml").read_text(encoding="utf-8"); t=re.sub(r"<parent>.*?</parent>","",t,count=1,flags=re.S); m=re.search(r"<version>([^<]+)</version>",t); print(m.group(1) if m else "")')
            if [[ -z "$POM_VER" ]]; then
              echo "无法从 pom.xml 解析 version" >&2
              exit 1
            fi
            TAG="v${POM_VER}"
          fi
          VERSION="${TAG#[vV]}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION}"

      - name: Build changelog from Version.md
        run: |
          python3 .github/scripts/extract-changelog.py \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --out "${{ github.workspace }}/release-notes.md"
          test -s "${{ github.workspace }}/release-notes.md"
          echo "----- release notes preview -----"
          cat "${{ github.workspace }}/release-notes.md"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (skip tests)
        run: ./mvnw -B -ntp -DskipTests clean package

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/storeit-*.jar dist/
          find dist -name '*.original' -delete
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TITLE="StoreIt ${VERSION}"
          NOTES="${GITHUB_WORKSPACE}/release-notes.md"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest \
              --draft=false \
              --prerelease=false
            gh release upload "$TAG" --repo "$REPO" dist/*.jar --clobber
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --latest \
              --target "${{ github.sha }}" \
              dist/*.jar
          fi
